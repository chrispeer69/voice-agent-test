[project]
name = "tow-agent-lab-server"
version = "0.1.0"
description = "Safe browser test harness for the Roadside Towing voice agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[anthropic,deepgram,runner,silero,webrtc]>=0.0.100",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
